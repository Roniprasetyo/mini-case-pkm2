<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplikasi Kasir Koperasi Sekolah — SMK Yappenda & Politeknik Astra">
    <title>Kasir Koperasi Sekolah — SMK Yappenda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ============ HEADER BAR ============ -->
    <header class="app-header">
        <div class="header-inner">
            <div class="header-brand">
                <span class="header-logo">🏪</span>
                <div class="header-titles">
                    <span class="header-title">KOPERASI SEKOLAH SMK YAPPENDA</span>
                    <span class="header-subtitle">Politeknik Astra — Jurusan Informatika</span>
                </div>
            </div>
            <div class="header-info">
                <span class="status-badge"><span class="status-dot"></span> Kasir Aktif</span>
                <span class="header-date" id="liveClock">--:--:--</span>
            </div>
        </div>
    </header>

    <!-- ============ MAIN APP ============ -->
    <div class="app">
        <!-- LEFT: Product Catalog -->
        <section class="catalog-section">
            <div class="catalog-header">
                <div class="catalog-title-group">
                    <h1 class="app-title">🏪 Koperasi Sekolah</h1>
                    <span class="app-subtitle">Sistem Kasir Digital</span>
                </div>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="Cari produk...">
                </div>
            </div>

            <div class="category-tabs" id="categoryTabs">
                <button class="cat-tab active" data-cat="semua">Semua</button>
                <button class="cat-tab" data-cat="atk">✏️ ATK</button>
                <button class="cat-tab" data-cat="makanan">🍿 Makanan</button>
                <button class="cat-tab" data-cat="minuman">🥤 Minuman</button>
            </div>

            <div class="product-grid" id="productGrid">
                <!-- Products injected by JS -->
            </div>
        </section>

        <!-- RIGHT: Shopping Cart -->
        <section class="cart-section">
            <div class="cart-header">
                <h2 class="cart-title">🛒 Keranjang</h2>
                <button class="btn-clear-cart" id="btnClearCart" title="Kosongkan keranjang">🗑️ Kosongkan</button>
            </div>

            <!-- Cart Items -->
            <div class="cart-items" id="cartItems">
                <div class="cart-empty" id="cartEmpty">
                    <span class="cart-empty-icon">🛒</span>
                    <p>Keranjang masih kosong</p>
                    <span>Klik produk untuk menambahkan</span>
                </div>
            </div>

            <!-- Cart Summary -->
            <div class="cart-summary" id="cartSummary">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span class="summary-value" id="subtotalValue">Rp 0</span>
                </div>
                <div class="summary-row discount-row">
                    <div class="discount-input-group">
                        <span>Diskon</span>
                        <div class="discount-field">
                            <input type="number" id="discountInput" class="discount-input" value="0" min="0" max="100">
                            <span class="discount-pct">%</span>
                        </div>
                    </div>
                    <span class="summary-value discount-value" id="discountValue">- Rp 0</span>
                </div>
                <div class="summary-row total-row">
                    <span>TOTAL</span>
                    <span class="summary-value total-value" id="totalValue">Rp 0</span>
                </div>

                <!-- Payment -->
                <div class="payment-section">
                    <label class="payment-label">💰 Uang Bayar</label>
                    <input type="number" id="paymentInput" class="payment-input" placeholder="Masukkan jumlah...">
                    <div class="change-display hidden" id="changeDisplay">
                        <span class="change-label">Kembalian:</span>
                        <span class="change-value" id="changeValue">Rp 0</span>
                    </div>
                </div>

                <button class="btn-pay" id="btnPay" disabled>💳 Bayar & Cetak Struk</button>
            </div>
        </section>
    </div>

    <!-- ============ RECEIPT MODAL ============ -->
    <div class="modal-overlay hidden" id="receiptOverlay">
        <div class="receipt-modal" id="receiptModal">
            <div class="receipt-content" id="receiptContent">
                <!-- Receipt generated by JS -->
            </div>
            <div class="receipt-actions">
                <button class="btn-new-transaction" id="btnNewTransaction">🔄 Transaksi Baru</button>
                <button class="btn-close-receipt" id="btnCloseReceipt">✕ Tutup</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast hidden" id="toast">
        <span id="toastIcon">✅</span>
        <span id="toastText"></span>
    </div>

    <script src="script.js"></script>
</body>
</html>
